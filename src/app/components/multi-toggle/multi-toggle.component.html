@if (portfolioService.toolbarService.decorations) {
  <span class="d-print-none extra-function" role="radiogroup"
    [attr.aria-label]="tooltipOf('Mode')" #clickableModeDecorated
    (keypress)="inputService.keypress($event)" (click)="$event.stopPropagation()"
    [title]="tooltipOf('Mode')">
    <!-- The track is an inner element, as the checkbox slider's label.switch is, -->
    <!-- so the outer .extra-function gives both sliders the same spacing. -->
    <span [ngClass]="radiosliderClass">
      <input #tagCloudElement type="radio" class="form-control bd-highlight toggle_option" id="first-toggle"
        [(ngModel)]="portfolioService.toolbarService.tagCloud" [value]="TagCloudDisplayMode.tagCloud" name="toggle_option"
        role="radio" [attr.aria-label]="tooltipOf('tag cloud', '')"
        (keypress)="inputService.keypress($event)"
        (click)="portfolioService.toolbarService.tagCloud=TagCloudDisplayMode.tagCloud">
      <input #chartElement type="radio" class="form-control bd-highlight toggle_option" id="second-toggle"
        [(ngModel)]="portfolioService.toolbarService.tagCloud" [value]="TagCloudDisplayMode.chart" name="toggle_option"
        role="radio" [attr.aria-label]="tooltipOf('chart', '')" (keypress)="inputService.keypress($event)"
        (click)="portfolioService.toolbarService.tagCloud=TagCloudDisplayMode.chart">
      <input #bothElement type="radio" class="form-control bd-highlight toggle_option" id="third-toggle"
        [(ngModel)]="portfolioService.toolbarService.tagCloud" [value]="TagCloudDisplayMode.both" name="toggle_option"
        role="radio" [attr.aria-label]="tooltipOf('both', '')" (keypress)="inputService.keypress($event)"
        (click)="portfolioService.toolbarService.tagCloud=TagCloudDisplayMode.both">
      <label id="{{ uiService.label('tag cloud') }}" for="first-toggle" class="form-label"
        [title]="tooltipOf('tag cloud', '')">
        @if (toggleService.captions) {
          <span class="caption"> {{ glyphOf('tag cloud') }} </span>
        }
      </label>
      <label id="{{ uiService.label('chart') }}" for="second-toggle" class="form-label"
        [title]="tooltipOf('chart', '')">
        @if (toggleService.captions) {
          <span class="caption"> {{ glyphOf('chart') }} </span>
        }
      </label>
      <label id="{{ uiService.label('both') }}" for="third-toggle" class="form-label"
        [title]="tooltipOf('both', '')">
        @if (toggleService.captions) {
          <span class="caption"> {{ glyphOf('both') }} </span>
        }
      </label>
      <div class="toggle-option-slider">
      </div>
    </span>
  </span>
} @else {

  <span class="d-print-none extra-function" role="radiogroup" [attr.aria-label]="tooltipOf('Mode')"
    #clickableMode (keypress)="inputService.keypress($event)" (click)="$event.stopPropagation()"
    [title]="tooltipOf('Mode')">
    <span id="{{ uiService.label('viewMode') }}" class="input-group-addon">{{
    portfolioService.model.ui['Mode']?.text }}:</span>

    <label id="{{ uiService.label('tag cloud') }}" for="tag cloud radio" class="form-label radio-inline"
      [title]="tooltipOf('tag cloud', '')"
      #clickableTagCloud (keypress)="inputService.keypress($event)"
      (click)="portfolioService.toolbarService.tagCloud=TagCloudDisplayMode.tagCloud">
      <input type="radio" class="form-control bd-highlight" id="tag cloud radio"
        [(ngModel)]="portfolioService.toolbarService.tagCloud" [value]="TagCloudDisplayMode.tagCloud" name="options"
        role="radio" [attr.aria-label]="tooltipOf('tag cloud', '')">{{
        portfolioService.model.ui['tag cloud']?.text }}
    </label>
    <label id="{{ uiService.label('chart') }}" for="chart radio" class="form-label radio-inline"
      [title]="tooltipOf('chart', '')" #clickableChart
      (keypress)="inputService.keypress($event)"
      (click)="portfolioService.toolbarService.tagCloud=TagCloudDisplayMode.chart">
      <input type="radio" class="form-control bd-highlight" id="chart radio"
        [(ngModel)]="portfolioService.toolbarService.tagCloud" [value]="TagCloudDisplayMode.chart" name="options"
        role="radio" [attr.aria-label]="tooltipOf('chart', '')">{{
        portfolioService.model.ui['chart']?.text }}
    </label>
    <label id="{{ uiService.label('both') }}" for="both radio" class="form-label radio-inline"
      [title]="tooltipOf('both', '')" #clickableBoth
      (keypress)="inputService.keypress($event)"
      (click)="portfolioService.toolbarService.tagCloud=TagCloudDisplayMode.both">
      <input type="radio" class="form-control bd-highlight" id="both radio"
        [(ngModel)]="portfolioService.toolbarService.tagCloud" [value]="TagCloudDisplayMode.both" name="options"
        role="radio" [attr.aria-label]="tooltipOf('both', '')">{{
        portfolioService.model.ui['both']?.text }}
    </label>
  </span>
}
